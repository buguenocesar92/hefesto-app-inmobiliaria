; =============================================================================
; Endurecimiento del runtime: CVE-2026-109618 / CVE-2026-109619 (PHP2Shell)
; =============================================================================
;
; QUE ES LO QUE SE APAGA AQUI
; --------------------------
; `session.upload_progress` es la via CONFIRMADA de CVE-2026-109619: un UAF en
; `php_session_rfc1867_callback` (ext/session/session.c). El manejador de subida
; de la sesion libera memoria mientras el request todavia la usa. PHP lo deja
; ENCENDIDO por omision, asi que apagarlo es la diferencia entre tener la via o
; no tenerla. Nada de esta aplicacion usa el progreso de subida de PHP: las
; subidas que hay van por la API, no por el formulario de HTML.
;
; LA VERSION DE PHP CON LA QUE SE CONSTRUYO ESTA IMAGEN
; ---------------------------------------------------
; PHP verificado: 8.3.36
;
; Es la version PARCHEADA de la serie 8.3. Las versiones parcheadas de PHP
; son 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12. Verificado el 2026-10-22 con:
;
;     $ docker run --rm php:8.3-fpm-bookworm php -v
;     PHP 8.3.36 (cli) (built: Oct 21 2026 16:00:25)
;
; OJO: LA IMAGEN DESPLIEGADA HAY QUE RECONSTRUIRLA
; -------------------------------------------------
; El parche de PHP entra en el contenedor por la IMAGEN, no por este repositorio.
; Mientras no se reconstruya y se redespliegue, el contenedor sigue con el PHP
; viejo. Este archivo es la red de seguridad para ese mientras, y lo que
; sobrevive a un redeploy.
;
; POR QUE `memory_limit = -1` NO ESTA AQUI
; -----------------------------------------
; El compose de este servicio NO declara `mem_limit`: no hay frontera de cgroup
; que acote la memoria del proceso. Sin esa frontera, `memory_limit = -1` seria
; una via de agotamiento de memoria en el HOST. Si alguna vez se declara
; `mem_limit` en el compose, esta linea tiene que volver, y el candado
; (api/tests/Unit/MitigacionPhp2ShellInmobiliariaTest.php) lo comprueba.
;
; CVE-2026-109618 / CVE-2026-109619 - PHP2Shell - 2026-10-22
; -----------------------------------------------------------------------------

session.upload_progress.enabled = Off
