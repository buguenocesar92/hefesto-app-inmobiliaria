; =============================================================================
; Hefesto Studio — Hefesto Inmobiliaria: PHP
; =============================================================================

; Motivos de cada valor, no numeros de relleno.
;
; NOTA SOBRE EL REGISTRO
; ----------------------
; `log_errors` con `stderr` y el nivel controlado por `LOG_LEVEL`. En
; produccion NO tiene que ser `debug`: el registro con nivel debug puede
; incluir el cuerpo de las peticiones, y en una inmobiliaria eso incluye
; clientes y operaciones. Ver docs/07.

expose_php = Off
max_execution_time = 60
max_input_time = 60
memory_limit = 256M

; ---------------------------------------------------------------Errores
; `display_errors` apagado siempre: un error mostrado en pantalla puede
; filtrar rutas y estructura de la base.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; ---------------------------------------------------------------Sesiones
; El tiempo de vida de la sesion lo gobierna SESSION_EXPIRACION_MINUTOS en el
; `.env`, no el `gc_maxlifetime` de PHP. Se deja el de PHP alineado por si
; alguien abre la aplicacion sin cargar el `.env`.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.cookie_httponly = 1

; En produccion tiene que ser 1: sin esto, un atacante que logra inyectar
; codigo podria cargar un .php arbitrario y ejecutarlo. El codigo de la
; aplicacion es de Hefesto y nunca viene del usuario, asi que 1 no estorba.
; Ver docs/07.
session.cookie_secure = 0

; ---------------------------------------------------------------Cargas
; `file_uploads` con limite propio, mas chico que el de la aplicacion: el
; limite real de las fotos es INMOBILIARIA_FOTOS_TAMANO_MAXIMO_KB.
file_uploads = On
upload_max_filesize = 8M
post_max_size = 10M

; ---------------------------------------------------------------OPcache
; En produccion se cachea el bytecode. En desarrollo hay que validar
; sellos de tiempo, o se ven cambios de codigo que ya no existen.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; ---------------------------------------------------------------Fecha
; La zona horaria la fija Laravel con APP_TIMEZONE, no PHP. Aqui solo se
; garantiza que los logs usen horario local.
date.timezone = America/Santiago